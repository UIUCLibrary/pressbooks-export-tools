name: "Copilot Setup Steps"

# Run automatically when this file changes (validates the setup works),
# and allow manual triggering from the Actions tab.
#
# The job runs inside a pre-built dev image (ghcr.io/uiuclibrary/pressbooks-export-tools-dev)
# that has Python 3.11, Node 20, Pandoc, and TeX Live pre-installed.
# This reduces setup time from ~10 minutes to ~30 seconds.
#
# To rebuild the image (e.g. after adding new system deps to Dockerfile.dev):
#   Actions → "Build and push dev image" → Run workflow
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: ghcr.io/uiuclibrary/pressbooks-export-tools-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python dependencies ──────────────────────────────────────────────────
      # Python 3.11 is pre-installed in the image; just install project deps.
      - name: Install Python dependencies
        run: pip install -e ".[test,math,pdf]"

      # ── Node.js dependencies ─────────────────────────────────────────────────
      # Node 20 is pre-installed in the image; just install project deps.
      - name: Install MathJax Node dependencies
        run: npm install --prefix src/pressbooks_export/math/backends/node

      # ── Verify ───────────────────────────────────────────────────────────────
      - name: Verify tool versions
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Pandoc ==="
          pandoc --version | head -1
          echo "=== LuaLaTeX ==="
          lualatex --version | head -1
          lualatex-dev --version | head -1 || echo "(lualatex-dev not available, lualatex will be used)"
          echo "=== TeX packages ==="
          kpsewhich luamml.sty  && echo "luamml:  OK" || echo "luamml:  MISSING"
          kpsewhich tagpdf.sty  && echo "tagpdf:  OK" || echo "tagpdf:  MISSING"
          echo "=== pytest ==="
          python -m pytest --version
