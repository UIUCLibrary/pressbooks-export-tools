name: "Copilot Setup Steps"

# Run automatically when this file changes (validates the setup works),
# and allow manual triggering from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -e ".[test,math,pdf]"

      # ── Node.js / MathJax + SRE ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/pressbooks_export/math/backends/node/package-lock.json

      - name: Install Node.js dependencies
        run: npm install --prefix src/pressbooks_export/math/backends/node

      # ── Pandoc ──────────────────────────────────────────────────────────────
      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      # ── TeX Live 2025+ ──────────────────────────────────────────────────────
      # Install a minimal TeX Live (scheme-small) with the packages needed for
      # PDF/UA-2 math tagging: luamml, tagpdf, and latex-bin-dev (lualatex-dev).
      #
      # Cache key includes a version token (bump `v2`, `v3`, … to force a fresh
      # install when you need to pick up TeX Live package updates).
      - name: Cache TeX Live
        id: cache-texlive
        uses: actions/cache@v4
        with:
          path: /usr/local/texlive
          key: texlive-${{ runner.os }}-v1

      - name: Install TeX Live (cache miss)
        if: steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          # Download the installer.  mirror.ctan.org redirects to a nearby
          # mirror; GitHub Actions runners have unrestricted internet access so
          # the redirect is followed transparently.
          curl -fsSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz \
            | tar -xz
          cd install-tl-*

          # Minimal profile: scheme-small gives us lualatex, amsmath, etc.
          # Install to a version-agnostic path so the cache key stays stable.
          cat > texlive.profile <<'EOF'
          selected_scheme scheme-small
          TEXDIR /usr/local/texlive/latest
          TEXMFLOCAL /usr/local/texlive/texmf-local
          TEXMFSYSCONFIG /usr/local/texlive/latest/texmf-config
          TEXMFSYSVAR /usr/local/texlive/latest/texmf-var
          TEXMFHOME ~/texmf
          option_doc 0
          option_src 0
          EOF

          # Run the installer non-interactively (~5-10 minutes for scheme-small)
          TEXLIVE_INSTALL_NO_CONTEXT_CACHE=1 \
            ./install-tl --profile=texlive.profile

          # Persist PATH for subsequent steps in this job
          echo "/usr/local/texlive/latest/bin/x86_64-linux" >> "$GITHUB_PATH"

          # Install the packages required for PDF/UA-2 math tagging
          /usr/local/texlive/latest/bin/x86_64-linux/tlmgr install \
            luamml tagpdf latex-bin-dev unicode-math

      - name: Add TeX Live to PATH (cache hit)
        if: steps.cache-texlive.outputs.cache-hit == 'true'
        run: echo "/usr/local/texlive/latest/bin/x86_64-linux" >> "$GITHUB_PATH"

      # ── Verify ──────────────────────────────────────────────────────────────
      - name: Verify tool versions
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Pandoc ==="
          pandoc --version | head -1
          echo "=== LuaLaTeX ==="
          lualatex --version | head -1
          lualatex-dev --version | head -1 || echo "(lualatex-dev not available, lualatex will be used)"
          echo "=== TeX packages ==="
          kpsewhich luamml.sty  && echo "luamml:  OK" || echo "luamml:  MISSING"
          kpsewhich tagpdf.sty  && echo "tagpdf:  OK" || echo "tagpdf:  MISSING"
          echo "=== pytest ==="
          python -m pytest --version
