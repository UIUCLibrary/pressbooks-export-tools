<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta property="og:title" content="Nested MathML Structures"/>
    <title>Nested MathML Structures</title>
</head>
<body>
<h1>Nested MathML Structures</h1>

<p>Nested fraction (inline):
<img class="latex" alt="\frac{\frac{a}{b}}{c}" src="https://example.com/math1.png" />
</p>

<p>Nested sqrt with fraction (inline):
<img class="latex" alt="\sqrt{\frac{x^2 + 1}{y^2 - 1}}" src="https://example.com/math2.png" />
</p>

<p>Matrix (block):</p>
<div class="display-math"><img class="latex" alt="\begin{pmatrix} a &amp; b \\ c &amp; d \end{pmatrix}" src="https://example.com/math3.png" /></div>

<p>Complex nested sum (block):</p>
<div class="display-math"><img class="latex" alt="\sum_{i=1}^{n} \frac{x_i^2}{\sqrt{1 + x_i^2}}" src="https://example.com/math4.png" /></div>

<p>Image without alt (should be ignored):
<img class="latex" src="https://example.com/no-alt.png" />
</p>

</body>
</html>
